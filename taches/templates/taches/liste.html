<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Des Taches</title>
</head>
<body>
    Bonjour tout le monde
    <ul>
    {% for tache in liste %}
    <li>{{tache.nom}} -- {{tache.status}}--- 
        <a href="{% url 'taches:modifier_tache' tache.pk %}">Modifier</a>
        ------------
        <a href="{% url 'taches:supprimer_tache' tache.pk %}">Supprimer </a>
       
    </li>

    {%empty%}
    <li>Il y'a pas de tache pour le moment</li>

    {%endfor%}
    </ul>
    <p> <a href="{% url 'taches:ajouter_tache'  %}">ajouter tache</a> </p>
</body>
</html>
